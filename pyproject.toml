[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "demand-driven-replenishment"
version = "1.0.0"
description = "Motor de reposición de stock por demanda y categorización ABCI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
  "numpy>=1.24",
  "streamlit>=1.28",
  "plotly>=5.18",
  "scikit-learn>=1.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
